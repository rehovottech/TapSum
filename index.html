<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Tap Sum</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta name="viewport"
        content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tap Sum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Inline, not in variables.css: that CSS arrives with the JS bundle, and until then the
         overlay text would show unstyled for a moment on every start. -->
    <style>
        /* Portrait only on the web: cover the game when a touch device is held sideways.
           The native app is locked to portrait, so it opts out with html.native. */
        #rotate-device{
            display: none;
        }

        @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
            html:not(.native) #rotate-device{
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background: #eeeeee;
                color: #2b3a47;
                font-family: sans-serif;
                font-size: 20px;
                text-align: center;
                padding: 16px;
                /* Wait a moment: a brief landscape layout while the page starts shouldn't flash it */
                animation: rotate-show 0.2s ease-out 0.5s both;
            }

            html:not(.native) #rotate-device .rotate-icon{
                font-size: 64px;
                animation: rotate-hint 1.6s ease-in-out infinite;
            }
        }

        @keyframes rotate-show{
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes rotate-hint{
            0%, 30%   { transform: rotate(-90deg); }
            60%, 100% { transform: rotate(0deg); }
        }
    </style>

    <!-- Mark the native app before the first paint, so the web-only rotate overlay never flashes.
         Capacitor injects its bridge before page scripts; the URL check covers a late bridge
         (iOS serves capacitor://localhost, Android https://localhost with no port). -->
    <script>
        (function () {
            var cap = window.Capacitor;
            var native = (cap && cap.isNativePlatform && cap.isNativePlatform())
                || location.protocol === 'capacitor:'
                || (location.hostname === 'localhost' && location.port === '');
            if (native) document.documentElement.classList.add('native');
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <!-- Web is portrait only: phones held sideways see this instead of the game -->
    <div id="rotate-device">
        <div class="rotate-icon">📱</div>
        <p>Please turn your device upright</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
